name: Updater

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BUNDLE_FROZEN: 'true'
      JEKYLL_ENV: production

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Read RubyGems version
      id: toolchain
      run: |
        rubygems_version=$(tr -d '\r\n' < .rubygems-version)
        printf 'rubygems=%s\n' "$rubygems_version" >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      uses: ruby/setup-ruby@v1
      with:
        rubygems: ${{ steps.toolchain.outputs.rubygems }}
        bundler-cache: true

    - name: Build site
      run: bundle exec jekyll build --strict_front_matter --trace

    - name: Push cleaned up build to other branch
      run: bash deploy.sh
      if: github.event_name == 'push'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
