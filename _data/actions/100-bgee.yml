bgee: 1
n: 100
name: RandomFly
instant: true
desc: |-
  This action gives the appearance of flying - the active creature is able to pass over impassable areas. The example script is from randfly.bcs.

  ```
  IF
    True()
  THEN
    RESPONSE #100
      RandomFly()
  END
  ```

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
