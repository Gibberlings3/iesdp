bgee: 1
n: 101
name: FlyToPoint
params:
  - name: Point
    type: p
  - name: time
    type: i
not_tested: true
desc: |-
  This action is used internally by action 100 (RandomFly); it moves the active creature towards the given point for the specified amount of time.

  {% capture note %}
  The action cannot be interrupted while the creature flies. When it completes, it also clears the creature's *Un-interruptable* flag (see [SetInterrupt()](#86)).

  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
