bgee: 1
n: 107
name: MoveToOffset
params:
  - name: Offset
    type: p
desc: |-
  This action instructs the active creature to move a certain distance from its current location; i.e. the point is relative to the creatures current location.

  {% capture note %}
  `Offset` is measured in search-map squares: the creature moves to its current position plus `Offset.x` × 16 and `Offset.y` × 12 pixels, using a [MoveToPoint()](#23) action that replaces this one.

  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
