bgee: 1
n: 11
name: EquipItemEx
params:
  - name: Object
    type: s
  - name: EquipUnEquip
    type: i
instant: true
desc: |-
  This action instructs the active creature to equip or unequip the specified item.

  {% capture note %}
  - The item must be in the creature's inventory for the action to work; otherwise the action fails.
  - The engine equips the item when `EquipUnEquip` is `0` and unequips it for any other value. These values are the reverse of <code><a href="{{ '/files/ids/bgee/xequip.htm' | prepend: relurl }}">xequip.ids</a></code> (`0` = `UNEQUIP`, `1` = `EQUIP`), so `EquipItemEx("item",EQUIP)` unequips the item.
  - When equipping, the item's global effects (`timing_mode=2`) are applied to the creature each time the action is performed, and avatar animations are updated to reflect the new item.
  - When unequipping, one instance of the item's global equipped effects is removed (global effects with other timing modes are not removed).
  - The item itself never moves in the inventory, in either mode, whether or not it was in the backpack or equipped.
  {% endcapture %} {% include info.html %}

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
