bgee: 1
n: 11
name: EquipItem
params:
  - name: Object
    type: s
instant: true
desc: |-
  This action instructs the active creature to equip the specified item.

  {% capture note %}
  - Item must be in the creature's inventory for the script action to function.
  - Item's global effects (`timing_mode=2`) are applied to the creature each time the action is performed, and avatar animations are updated to reflect the new item.
  {% endcapture %} {% include info.html %}

  {% capture note %}
  The engine runs this action with the same code as [EquipItemEx()](#11-2-bgee): it is equivalent to `EquipItemEx(Object,0)`, which equips the item.

  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
