bgee: 1
n: 124
name: Berserk
instant: true
desc: |-
  {% capture note %}
  This action only has an effect while the creature is already berserk (for example under [opcode #3]({{ "/opcodes/bgee.htm#op3" | prepend: relurl }})); otherwise it completes at once. While the creature is berserk, the action queues an attack on a nearby creature, chosen from its enemies or from anyone.

  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
