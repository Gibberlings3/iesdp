name: AnkhegEmerge
desc: |-
  This action is likely called directly by the engine, and is used to give ankegs the appearance of emerging from the ground. Calling the action from script has no effect.

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
