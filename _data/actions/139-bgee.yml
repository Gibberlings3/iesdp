bgee: 1
n: 139
name: PlayerDialog
params:
  - name: Target
    type: o
desc: |-
  This action instructs the active creature to start a dialog with the target creature, from any distance. If the target is invalid, no action will be taken.

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
