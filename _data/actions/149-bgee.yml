bgee: 1
n: 149
name: EquipMostDamagingMelee
instant: true
desc: |-
  This action instructs the active creature to equip the most damaging melee weapon from those available in the quickslots. Damage is calculated on the THAC0 bonus and damage - special bonuses versus creature types and elemental damages are not checked.

  ```
  IF
    See([EVILCUTOFF])
  THEN
    RESPONSE #100
      EquipMostDamagingMelee()
      Attack([EVILCUTOFF])
  END
  ```

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
