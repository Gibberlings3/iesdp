bgee: 1
n: 150
name: StartStore
params:
  - name: Store
    type: s
  - name: Target
    type: o
instant: true
desc: |-
  This action starts the specified store with the specified object.

  ```
  IF
    Global("KRSTART_STORE","LOCALS",1)
  THEN
    RESPONSE #100
      StartStore("Tem4802",LastTalkedToBy())
  END
  ```

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
