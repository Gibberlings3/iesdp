name: EscapeAreaDestroy
params:
  - name: Delay
    type: i
desc: |-
  This action instructs the active creature to search for the nearest travel trigger point for the specified time (measured in second) before giving up and just disappearing.

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
