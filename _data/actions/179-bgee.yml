bgee: 1
n: 179
name: DialogInterrupt
params:
  - name: State
    type: i
    ids: boolean
instant: true
desc: |-
  This action sets the interrupt state of the active creature. When set to false the creature cannot receive dialog requests or issue verbal constants. The interrupt state of a creature is not saved.

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
