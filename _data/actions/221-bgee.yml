bgee: 1
n: 221
name: SetMoraleAI
params:
  - name: Morale
    type: i
    ids: moraleai
no_result: true
instant: true
desc: |-
  {% capture note %}
  `Morale` replaces the morale-AI value. The engine stores the result in the creature's morale-AI value, clamped to 1–5 (PANIC, SHAKEN, CAUTIOUS, AGGRESSIVE, COCKY). No other engine code reads that value, so the action has no observable effect.

  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
