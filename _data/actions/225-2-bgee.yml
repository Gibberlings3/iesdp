bgee: 1
n: 225
name: MoveBetweenAreasEffect
params:
  - name: Area
    type: s
  - name: Graphic
    type: s
  - name: Location
    type: p
  - name: Face
    type: i
    ids: dir
instant: true
desc: |-
  This action will move the active creature to the specified point in the indicated area, facing the appropriate direction, and plays the specified graphics when the creature disappears.

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
