bgee: 1
n: 225
name: MoveBetweenAreas
params:
  - name: Area
    type: s
  - name: Location
    type: p
  - name: Face
    type: i
    ids: dir
instant: true
desc: |-
  This action will move the active creature to the specified point in the indicated area, facing the appropriate direction.

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
