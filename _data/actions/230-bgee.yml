bgee: 1
n: 230
name: RestParty
instant: true
desc: |-
  This action duplicates the effects of resting. Such resting is not interruptible, and functions even if enemies are nearby. The second variant allows to specify the amount of gold to spend on the rest, a HP bonus in addition to natural healing, as well as an option to suppress the rest movie. A non-zero amount of gold forces the "Rest at Inn" movie to play, regardless of the current area type.
