bgee: 1
n: 239
name: MoveToCenterOfScreen
params:
  - name: NotInterruptableFor
    type: i
desc: |-
  This action moves the active creature to the centre of the screen. Script conditions are not checked for the specified duration (measured in seconds) or until the creature has reached the screen centre.

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
