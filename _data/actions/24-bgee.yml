bgee: 1
n: 24
name: Panic
instant: true
desc: |-
  This action causes the active creature to move randomly around the screen.

  ```
  IF
    HPPercentLT(Myself,15)
  THEN
    RESPONSE #100
     Panic()
  END
  ```

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
