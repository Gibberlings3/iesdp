bgee: 1
n: 257
name: PickUpItem
params:
  - name: ResRef
    type: s
desc: |-
  This action instructs the active creature remove the item from the area and put it in their inventory (assuming the inventory has enough room and the item exists).

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
