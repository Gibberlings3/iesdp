bgee: 1
n: 265
name: DialogueForceInterrupt
params:
  - name: Object
    type: o
desc: |-
  These actions work the same as their counterpart dialog actions. The only difference is that they are important enough to interrupt other dialogs already in action.

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
