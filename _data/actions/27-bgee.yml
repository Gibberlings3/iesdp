bgee: 1
n: 27
name: ProtectPoint
params:
  - name: Target
    type: p
  - name: Range
    type: i
desc: |-
  This action causes the active creature to guard the specified point, staying within the specified range.

  ```
  IF
    True()
  THEN
    RESPONSE #100
      ProtectPoint([1738.543],10)
  END
  ```

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
