name: PolymorphCopy
params:
  - name: Object
    type: o
instant: true
desc: |-
  This action changes the animation of the active creature to match the animation of the target object.

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
