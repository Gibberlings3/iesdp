bgee: 1
n: 28
name: RemoveTraps
params:
  - name: Trap
    type: o
desc: |-
  This action causes the active creature to attempt to disarm the specified trap. This action can be used for any creature (not just thieves) though success in disarming is dependent on points in the Disarm Trap skill.

  ```
  IF
    See("Trap01")
    Class(Myself,THIEF_ALL)
  THEN
    RESPONSE #100
      RemoveTraps("Trap01")
  END
  ```

  {% capture note %}
  Doors, containers, regions, and area or global scripts that perform this action use a separate implementation: it involves no skill roll and awards no experience.
  {% endcapture %} {% include info.html %}
