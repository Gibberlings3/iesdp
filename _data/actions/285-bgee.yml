name: PolymorphCopyBase
params:
  - name: Object
    type: o
instant: true
desc: |-
  This action copies the base animation (i.e. no armour or colouring) of the target creature to the active creature.

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
