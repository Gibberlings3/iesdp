bgee: 1
n: 289
name: AddSuperKit
params:
  - name: Kit
    type: i
    ids: kit
instant: true
desc: |-
  This action sets the active creatures kit to the specified kit . Abilities from any previous kits are kept. Class restrictions apply for kits. When attempting adding an invalid kit, the existing kit (if any) will be replied.

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
