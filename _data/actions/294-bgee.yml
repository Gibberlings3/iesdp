name: StartDialogOverrideInterrupt
params:
  - name: DialogFile
    type: s
  - name: Target
    type: o
desc: |-
  {% capture note %}
  The engine implements this action. It uses the given dialog file only for this conversation, as [StartDialogOverride()](#293-bgee) does, and takes the same interrupting branch as [StartDialogInterrupt()](#266).

  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
