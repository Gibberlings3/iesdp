bgee: 1
n: 297
name: MoveToSavedLocation
params:
  - name: GLOBAL
    type: s
  - name: Area
    type: s
desc: |-
  This action instructs the active creature to move to the previously saved specified location.

  ```
  IF
    Global("MoveToLocation","LOCALS",0)
  THEN
    RESPONSE #50
      SetGlobal("MoveToLocation","LOCALS",1)
      MoveToSavedLocationn("DefaultLocation","LOCALS")
  END
  ```

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
