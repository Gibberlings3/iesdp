bgee: 1
n: 3
name: Attack
params:
  - name: Target
    type: o
desc: |-
  This action instructs the active creature to continually attack the target, i.e. the active creature will not switch targets until its target is dead.

  ```
  IF
    See([EVILCUTOFF])
    Class(LastSeenBy(),MAGE_ALL)
    !InParty(LastSeenBy())
  THEN
    RESPONSE #100
      Attack(LastSeenBy())
  END
  ```

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}

  {% capture note %}
  [AttackNoSound()](#98) and [AttackOneRound()](#105-bgee) run the same code, but only Attack() itself can play the creature's battle cry when the attack starts.
  {% endcapture %} {% include info.html %}
