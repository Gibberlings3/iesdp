bgee: 1
n: 322
name: FakeEffectExpiryCheck
params:
  - name: Object
    type: o
  - name: Ticks
    type: i
instant: true
desc: |-
  This action removes effects with a duration timing mode from the specified object, if the remaining duration is below the ticks parameter. The action appears to only work from a creature script.

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
