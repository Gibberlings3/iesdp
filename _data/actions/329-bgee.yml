bgee: 1
n: 329
name: TriggerWalkTo
params:
  - name: Object
    type: o
instant: true
desc: |-
  {% capture note %}
  The engine implements this action: it sends trigger `0x00D6` from the performer to the targeted trigger region and then completes. The creature does not walk anywhere. When the performer is a creature, the trigger is sent only if it stands within two search-map squares of the region's walk-to point. Otherwise the action completes without effect.
  {% endcapture %} {% include info.html %}
