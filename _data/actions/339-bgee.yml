bgee: 1
n: 339
name: SwingOnce
desc: |-
  This action instructs the active creature to play the swing weapon animation once. Note that some objects do not have this animation.

  {% capture note %}
  The engine runs this action with the same code as [Swing()](#38).

  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
