bgee: 1
n: 356
name: TransformItem
params:
  - name: OldItem
    type: s
  - name: NewItem
    type: s
instant: true
desc: |-
  This action changes the item specified by the OldItem parameter into the item specified by the NewItem parameter, retaining the charges/flags of OldItem.

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
