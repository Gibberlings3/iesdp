bgee: 1
n: 358
name: JumpToObject
params:
  - name: Target
    type: o
instant: true
desc: |-
  This action teleports the active creature to the object specified by the Target parameter.

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
