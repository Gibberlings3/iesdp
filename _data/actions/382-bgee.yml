name: JoinPartyOverride
instant: true
desc: |-
  This action behaves like [JoinParty()](#19), except that it uses [MakeGlobalOverride()](#383) to promote a creature to global status.

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
