bgee: 1
n: 39
name: Recoil
desc: |-
  This action instructs the active creature to play the recoil animation. Note that some objects do not have this animation.

  ```
  IF
    TookDamage()
  THEN
    RESPONSE #100
      Recoil()
  END
  ```

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
