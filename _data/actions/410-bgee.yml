bgee: 1
n: 410
name: RandomWalkTime
params:
  - name: Time
    type: i
desc: |-
  It is the same as [RandomWalk()](#85), where the time parameter represents a limit on how many times the action will result in walking. Turning or waiting does not count against this limit. Since it is random, there is no guarantee movement will be immediate.

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
