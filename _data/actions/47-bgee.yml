bgee: 1
n: 47
name: Formation
params:
  - name: Leader
    type: o
  - name: Offset
    type: p
desc: |-
  This action can used to make the active creature follow the creature specified by the leader parameter, maintain a relative position determined by the offset parameter.

  ```
  IF
    CombatCounter(0)
    Allegiance(Myself,NEUTRAL)
  THEN
    RESPONSE #100
      Formation("QSLMAGE1",[-2.-5])
  END
  ```

  {% capture note %}
  This action never completes by itself: the creature keeps holding its position relative to the leader until the action is interrupted or its actions are cleared. It is interruptible.

  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
