bgee: 1
n: 470
name: WaitForVoiceChannel
desc: |-
  This action delays subsequent script actions until the voice channel of the active creature is ready to play a new sound.

  {% capture note %}
  The action keeps running, and cannot be interrupted, while the creature's voice sound is playing.

  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
