name: BackStab
params:
  - name: Target
    type: o
no_result: true
desc: |-
  {% capture note %}
  The Enhanced Edition engine implements this action as a stub: it only looks up the target and never completes by itself, so the actions queued after it do not run until the creature's actions are cleared.

  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
