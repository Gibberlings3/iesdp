bgee: 1
n: 66
name: DayNight
params:
  - name: TimeOfDay
    type: i
    ids: time
instant: true
desc: |-
  This action changes the time of day. The time parameter is taken from [time.ids]({{ ids }}/time.htm), though a direct number can be specified. The example script is from when Irenicus leaves his dungeon.

  ```
  IF
    Global("AmaWaukeen","GLOBAL",1)
  THEN
    RESPONSE #100
      DayNight(MIDNIGHT)
      SetGlobal("AmaWaukeen","GLOBAL",2)
      FadeToColor([20.0],0)
      CreateCreature("shthass1",[877.898],7)
      StartCutSceneMode()
      StartCutScene("cut24a")
  END
  ```

  {% capture note %}
  The engine only moves the game clock forward: it advances to the next occurrence of the requested time of day, on the following day if that time has already passed today. If the requested time is 900 ticks or less ahead (60 seconds, in the units of `AdvanceTime()`), the clock is not changed.
  {% endcapture %} {% include info.html %}
