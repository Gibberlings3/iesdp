bgee: 1
n: 84
name: Face
params:
  - name: Direction
    type: i
    ids: dir
instant: true
desc: |-
  This action instructs the active creature to face the specified direction. Directions run from 0-15 with 0 being south and moving clockwise. Negative values act as relative directions to the current direction.

  ```
  IF
    Global("BeholderBehavior","LOCALS",0)
    See([PC])
    HPGT(Myself,65)
  THEN
    RESPONSE #100
      FaceObject([PC])
      ForceSpell([PC],BEHOLDER_CHARM_PERSON)
      Continue()
  END
  ```

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
