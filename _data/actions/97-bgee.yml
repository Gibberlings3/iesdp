bgee: 1
n: 97
name: UseItemPoint
params:
  - name: Item
    type: s
  - name: Target
    type: p
  - name: Ability
    type: i
desc: |-
  This action instructs the active creature to use an item denoted by item or slot at the specified point on the map. Ability denotes the charged ability to use. This action ignores the item's usability flags.

  {% capture note %}
  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
