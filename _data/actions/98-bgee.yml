bgee: 1
n: 98
name: AttackNoSound
params:
  - name: Target
    type: o
desc: |-
  This action instructs the active creature to attack the target, without sounding a battlecry.

  {% capture note %}
  This action runs the same code as [Attack()](#3), with two differences when the attack starts: it plays no battle cry and does not post `Attack()`'s combat feedback message.

  Only creatures can perform this action. When another script runner (a door, container, region, or an area or global script) executes it, it fails at once without any effect.
  {% endcapture %} {% include info.html %}
